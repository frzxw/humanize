name: New language
description: Propose failures that belong to a language the skill does not cover yet.
title: "feat: "
labels:
  - enhancement
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Bahasa Jawa
    validations:
      required: true
  - type: textarea
    id: failures
    attributes:
      label: Failures a native reader notices
      description: Name two or three tells that are specific to this language. A straight translation of the English list is not the section by itself.
    validations:
      required: true
  - type: textarea
    id: pair
    attributes:
      label: Before and after
      description: One short passage in that language, then the edit. Do not add facts the first version did not have.
    validations:
      required: true
